<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="FrostFold">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#1a2150"/>
      <stop offset="0.55" stop-color="#5c2a6d"/>
      <stop offset="1"    stop-color="#e2744f"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="hinge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="clip"><rect width="128" height="128" rx="28" ry="28"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="128" height="128" fill="url(#bg)"/>

    <!-- Two "windows" on the display behind the glass. -->
    <g opacity="0.5">
      <rect x="16" y="30" width="44" height="52" rx="4" fill="#ffffff" opacity="0.85"/>
      <rect x="16" y="30" width="44" height="8"  rx="4" fill="#4a9bf0"/>
      <rect x="70" y="44" width="46" height="42" rx="4" fill="#ffffff" opacity="0.85"/>
      <rect x="70" y="44" width="46" height="8"  rx="4" fill="#ef5b6e"/>
    </g>

    <!-- The pane, hinged along the bottom edge and leaning toward the viewer,
         so it reads wider at the top. -->
    <path d="M20 104 L108 104 L122 40 L6 40 Z"
          fill="url(#pane)" stroke="#ffffff" stroke-opacity="0.45"
          stroke-width="1.5" stroke-linejoin="round"/>

    <!-- The hinge itself. -->
    <path d="M20 104 L108 104" stroke="url(#hinge)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
